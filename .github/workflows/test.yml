name: test

# Runs on PRs (to gate merges) and on pushes to master (post-merge).
# Feature-branch pushes are covered by the pull_request event, avoiding
# duplicate runs.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  websocket:
    name: websocket (node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/websocket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      # The lib tests only use Node built-ins, so no install step is needed.
      - run: node --test

  forum:
    name: forum (django test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: crimson
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        # ForumUser's post_save signal writes to the cache, so a backend must
        # be reachable (settings use PyLibMCCache).
        image: memcached:alpine
        ports:
          - 11211:11211
    env:
      LOCAL_ENV: '1'            # local static/media, no AWS, non-secure cookies
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: crimson
      CACHE_LOCATION: localhost:11211
    defaults:
      run:
        working-directory: app/forum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # matches the forum Dockerfile
          cache: pip
          cache-dependency-path: app/forum/requirements.txt
      # pylibmc is built from source and needs the libmemcached headers.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmemcached-dev libsasl2-dev
      - name: Install python dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test user.test_forms utils.test_extra_tags forum.test_models forum.test_util --verbosity 2

  postmarkup:
    name: postmarkup (vendored bbcode lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/forum/utils/postmarkup
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # The vendored suite exercises create() with syntax highlighting, which
      # needs Pygments (the app itself runs with use_pygments=False, so it is
      # only a test dependency here).
      - name: Install test dependencies
        run: pip install pygments
      - name: Run tests
        run: python -m unittest postmarkup.tests --verbose
