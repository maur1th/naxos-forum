---
- hosts: app
  become: yes
  vars:
    network: "{{project_name}}"
  roles:
    - name: common
    - name: docker
    - name: docker_network
      networks:
        - postgres
        - nginx
        - "{{project_name}}"
    - name: postgres
      version: "13.8"
    - name: memcached
      version: "1.6"
    - name: forum
      network: "{{project_name}}"
    - name: certbot-ovh
      domains:
        - geekattitude.org
        - www.geekattitude.org
    - name: nginx
      version: "1.22"
    # - name: metrics
    #   prometheus_version: latest  # until they have a better taging policy
    #   cadvisor_version: latest    # ...
  tasks:
    # Reclaim hard drive space: the forum image is pulled under a new tag on
    # every release, so old versions are tagged-but-unused and only `-a` removes
    # them. Runs after all containers are (re)started, so in-use images are kept.
    - name: prune unused docker images & stopped containers
      command: docker system prune --all --force
      register: docker_prune
      changed_when: "'Total reclaimed space: 0B' not in docker_prune.stdout"

...
