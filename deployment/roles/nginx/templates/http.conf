{{ ansible_managed | comment }}

##
## Basic configuration
##

tcp_nopush on;
tcp_nodelay on;
server_tokens off;

##
## Security headers
##

add_header 'X-Frame-Options' 'DENY' always;
add_header 'X-Content-Type-Options' 'nosniff' always;
add_header 'X-XSS-Protection' '1; mode=block' always;
# same-origin, not no-referrer: Django's CSRF check needs Origin/Referer on
# same-site POSTs, and browsers send "Origin: null" under no-referrer.
add_header 'Referrer-Policy' 'same-origin' always;
add_header 'X-Robots-Tag' 'noindex, nofollow' always;
add_header 'Strict-Transport-Security' 'max-age=63072000; includeSubDomains; preload' always;

##
## Rate limiting
##

# Only POSTs (login attempts, reset mails) are counted: an empty key is not
# limited, so merely displaying the forms is free.
map $request_method $auth_limit_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $auth_limit_key zone=auth:1m rate=5r/m;
limit_req_status 429;

##
## Gzip Settings
##

gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

##
## HTTPS settings
##

ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# OCSP stapling
ssl_stapling            on;
ssl_stapling_verify     on;
