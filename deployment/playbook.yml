---
- hosts: app
  become: yes
  vars:
    network: "{{project_name}}"
  roles:
    - name: common
    - name: docker
    - name: docker_network
      networks:
        - postgres
        - nginx
        - "{{project_name}}"
    - name: postgres
      # Django 5.2 requires PostgreSQL 14+. Bumping this major version on an
      # existing host is NOT a plain redeploy: the postgres role starts the new
      # image on the existing data volume, and PG16 will refuse a PG13 data dir.
      # A one-time data migration (pg_dumpall on 13 -> restore on 16, or
      # pg_upgrade) must be performed in a maintenance window before/at deploy.
      version: "16"
    - name: memcached
      version: "1.6"
    - name: forum
      network: "{{project_name}}"
    - name: certbot-ovh
      domains:
        - geekattitude.org
        - www.geekattitude.org
    - name: nginx
      version: "1.22"
    # - name: metrics
    #   prometheus_version: latest  # until they have a better taging policy
    #   cadvisor_version: latest    # ...
  tasks:
    # Reclaim hard drive space
    - name: clean outdated docker images & stopped containers
      shell: >
        docker system prune --force &&
        docker rmi $(docker images --quiet --filter dangling=true)
      failed_when: no
      changed_when: no
...
