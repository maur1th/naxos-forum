---
services:

  forum:
    build:
      context: app/forum
      args:
        LOCAL_ENV: 1
    # dev writes to the bind mount and the media volume, so keep root here
    user: root
    environment:
      DEBUG: 1
      INTERNAL_IP: 172.18.0.1
    volumes:
      - ./app/forum:/app
      - forum-media:/app/media
    ports:
      - "8081:8080"
    depends_on:
      - db
      # - memcached
    restart: always

  db:
    image: postgres:16-alpine
    volumes:
      - forum-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: crimson
    restart: always

  # memcached:
  #   image: memcached:1.6-alpine
  #   restart: always

  # nginx:
  #   image: nginx:1.22-alpine
  #   volumes:
  #     - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./app/forum/static_root:/data/static:ro
  #     - forum-media:/data/media:ro
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - forum
  #   restart: always

volumes:
  forum-db: {}
  forum-media: {}
...
