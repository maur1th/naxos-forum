---
- name: start postgres container
  docker_container:
    name: postgres
    image: postgres:{{version}}
    pull: yes
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{network}}"
        aliases:
          - db
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "{{volume}}:/var/lib/postgresql/data"
...
